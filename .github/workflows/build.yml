name: Build Smart Education AI APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          if [ -z "$(find . -maxdepth 3 -name 'settings.gradle*' | head -n1)" ]; then
            unzip -q -o ./*.zip
          fi
          SETTINGS=$(find . -maxdepth 3 -name 'settings.gradle*' | head -n1)
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
